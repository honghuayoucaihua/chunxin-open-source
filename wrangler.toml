"$schema" = "./node_modules/wrangler/config-schema.json"

name = "chunxin-open-source"          # 必须与 Cloudflare 项目名完全一致
compatibility_date = "2026-05-04"
pages_build_output_dir = "dist"        # 指向 Vite 的构建输出目录

[vars]
TZ = "Asia/Shanghai"
SYSHUO_API_URL = "https://api.deepseek.com/v1/chat/completions"  # 填入你的实际 API 地址
DIVINATION_API_URL = ""               # 如未使用占卜功能，留空即可
ALLOWED_ORIGINS = ""
BUILTIN_AI_MODELS = "free/cc"
BUILTIN_AI_DEFAULT_MODEL = "free/cc"
BUILTIN_AI_FALLBACK_MODEL = "free/cc"
BUILTIN_AI_DAILY_LIMIT = "500"
BUILTIN_AI_PREMIUM_DAILY_LIMIT = "2000"
BUILTIN_AI_MAX_CONTEXT_CHARS = "50000"
BUILTIN_AI_PROXY_TIMEOUT_MS = "180000"
BUILTIN_AI_RATE_LIMIT_MAX = "20"
BUILTIN_AI_RATE_LIMIT_WINDOW_MS = "60000"
APK_R2_PUBLIC_BASE_URL = ""

[[d1_databases]]
binding = "APP_DB"
database_name = "chunxin"
database_id = "你的真实D1数据库ID"      # 必须替换
preview_database_id = "你的真实D1预览数据库ID"  # 如无预览库，可填与上面相同的值

[[r2_buckets]]
binding = "COMMUNITY_BUCKET"
bucket_name = "chunxin-community-assets"
preview_bucket_name = "chunxin-community-assets-preview"
