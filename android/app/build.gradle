apply plugin: 'com.android.application'

// 从 package.json 读取版本号
def packageJson = new File(rootProject.projectDir.parent, 'package.json')
def versionFromPackage = "1.0.0"
def buildNumberFromPackage = 1
if (packageJson.exists()) {
    def content = packageJson.text
    def matcher = content =~ /"version"\s*:\s*"([^"]+)"/
    if (matcher.find()) {
        versionFromPackage = matcher.group(1)
    }
    def buildMatcher = content =~ /"buildNumber"\s*:\s*([0-9]+)/
    if (buildMatcher.find()) {
        buildNumberFromPackage = buildMatcher.group(1) as int
    }
}

def overrideVersionName = System.getenv('APK_VERSION_NAME')
def overrideBuildNumber = System.getenv('APK_BUILD_NUMBER')
if (overrideVersionName != null && overrideVersionName.trim()) {
    versionFromPackage = overrideVersionName.trim()
}
if (overrideBuildNumber != null && overrideBuildNumber.trim()) {
    buildNumberFromPackage = overrideBuildNumber.trim() as int
}

// 计算版本号：1.2.3 -> 10203 (用于 versionCode)
def versionParts = versionFromPackage.split('\\.')
def versionCodeNum = 0
if (versionParts.length >= 3) {
    versionCodeNum = (versionParts[0] as int) * 10000 + (versionParts[1] as int) * 100 + (versionParts[2] as int)
} else if (versionParts.length >= 2) {
    versionCodeNum = (versionParts[0] as int) * 10000 + (versionParts[1] as int) * 100
} else {
    versionCodeNum = (versionParts[0] as int) * 10000
}
if (buildNumberFromPackage > 0) {
    versionCodeNum = buildNumberFromPackage
}

def releaseStoreFilePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: 'android-release.jks'
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: ''
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: ''

android {
    namespace = "com.xushuo.lk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xushuo.lk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeNum
        versionName versionFromPackage
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    signingConfigs {
        release {
            storeFile file(releaseStoreFilePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
